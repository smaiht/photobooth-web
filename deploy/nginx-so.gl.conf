server {
    listen 80;
    listen [::]:80;
    server_name so.gl www.so.gl;

    root /var/www/so.gl;
    index index.html;
    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location = /index.html {
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(?:css|js|mjs|svg|png|jpe?g|webp|avif|gif|ico|mp4|webm)$ {
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
