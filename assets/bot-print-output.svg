<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title description">
  <title id="title">Готовая фотография выходит из деревянной фотобудки</title>
  <desc id="description">Из прорези в нижней деревянной части фотобудки выходит тот же снимок, который гость отправил боту.</desc>
  <defs>
    <linearGradient id="background" x1="80" y1="20" x2="880" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF6E7"/>
      <stop offset=".55" stop-color="#F7EDFF"/>
      <stop offset="1" stop-color="#FFE7EF"/>
    </linearGradient>
    <linearGradient id="photo-sky" x1="24" y1="24" x2="576" y2="376" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF82A9"/>
      <stop offset=".5" stop-color="#FFD567"/>
      <stop offset="1" stop-color="#91C7FF"/>
    </linearGradient>
    <linearGradient id="wood" x1="120" y1="0" x2="840" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B97847"/>
      <stop offset=".5" stop-color="#8C4F2F"/>
      <stop offset="1" stop-color="#603225"/>
    </linearGradient>
    <filter id="machine-shadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#251B2B" flood-opacity=".2"/>
    </filter>
    <filter id="paper-shadow" x="-25%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="15" stdDeviation="13" flood-color="#251B2B" flood-opacity=".22"/>
    </filter>
    <symbol id="guest-photo" viewBox="0 0 600 400">
      <clipPath id="photo-clip">
        <rect width="600" height="400" rx="28"/>
      </clipPath>
      <g clip-path="url(#photo-clip)">
        <rect width="600" height="400" fill="url(#photo-sky)"/>
        <circle cx="516" cy="82" r="36" fill="#FFF2B9" fill-opacity=".94"/>
        <path d="M0 292c78-68 158-83 240-20 82-94 196-97 360 10v118H0V292Z" fill="#8660DC" fill-opacity=".48"/>
        <path d="M0 340c101-61 190-55 268 12 88-76 199-70 332 8v40H0v-60Z" fill="#B96D9E" fill-opacity=".68"/>
        <circle cx="242" cy="185" r="43" fill="#FFFDF9" fill-opacity=".9"/>
        <path d="M157 352c14-97 51-145 85-145s71 48 85 145" fill="#251B2B"/>
        <circle cx="380" cy="201" r="38" fill="#FFFDF9" fill-opacity=".86"/>
        <path d="M306 352c12-86 44-129 74-129s62 43 74 129" fill="#4F3159"/>
      </g>
    </symbol>
  </defs>

  <rect width="960" height="720" fill="url(#background)"/>

  <g filter="url(#machine-shadow)">
    <path d="M72-40h816v348c0 46-37 83-83 83H155c-46 0-83-37-83-83V-40Z" fill="url(#wood)"/>
    <path d="M105 86c148-55 286 39 438-2 114-31 204-12 302 26M101 158c118-36 233 28 358 3 146-29 254-3 391 40M99 278c145-45 266 30 408-4 124-30 224-6 340 28" fill="none" stroke="#F4C18E" stroke-width="8" stroke-linecap="round" opacity=".14"/>
    <path d="M72 308c0 46 37 83 83 83h650c46 0 83-37 83-83" fill="none" stroke="#4C261C" stroke-width="7" opacity=".42"/>
  </g>

  <g filter="url(#paper-shadow)" transform="rotate(-1 480 460)">
    <rect x="250" y="224" width="460" height="414" rx="10" fill="#FFFDF9"/>
    <use href="#guest-photo" x="278" y="266" width="404" height="269.333"/>
  </g>

  <rect x="205" y="187" width="550" height="76" rx="27" fill="#442219"/>
  <rect x="236" y="211" width="488" height="29" rx="14.5" fill="#100807"/>
</svg>
