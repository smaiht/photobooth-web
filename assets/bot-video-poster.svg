    <path d="M38 70c0-23 19-42 42-42h800c23 0 42 19 42 42v72H38V70Z" fill="#251B2B"/>

    <circle cx="94" cy="85" r="31" fill="#FF4F8B"/>
    <rect x="77" y="72" width="34" height="27" rx="7" fill="none" stroke="#FFFDF9" stroke-width="5"/>
    <circle cx="94" cy="85" r="7" fill="#FFD567"/>
    <path d="m84 72 5-7h11l5 7" fill="none" stroke="#FFFDF9" stroke-width="5" stroke-linecap="round"/>
    <text x="142" y="79" fill="#FFFDF9" font-family="Arial, sans-serif" font-size="25" font-weight="800">SO.GL · БОТ ПЕЧАТИ</text>
    <text x="142" y="111" fill="#ACE8D3" font-family="Arial, sans-serif" font-size="18" font-weight="700">бот мероприятия · онлайн</text>
