<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title description">
  <title id="title">Фотография отправлена боту печати</title>
  <desc id="description">Чистый экран переписки: гость отправляет фотографию, а бот подтверждает её отправку на печать.</desc>
  <defs>
    <linearGradient id="chat-background" x1="80" y1="150" x2="900" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FAF4FE"/>
      <stop offset=".58" stop-color="#FFFDF9"/>
      <stop offset="1" stop-color="#FFF0F5"/>
    </linearGradient>
    <linearGradient id="photo-sky" x1="24" y1="24" x2="576" y2="376" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF82A9"/>
      <stop offset=".5" stop-color="#FFD567"/>
      <stop offset="1" stop-color="#91C7FF"/>
    </linearGradient>
    <filter id="message-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#251B2B" flood-opacity=".12"/>
    </filter>
    <symbol id="guest-photo" viewBox="0 0 600 400">
      <clipPath id="photo-clip">
        <rect width="600" height="400" rx="28"/>
      </clipPath>
      <g clip-path="url(#photo-clip)">
        <rect width="600" height="400" fill="url(#photo-sky)"/>
        <circle cx="516" cy="82" r="36" fill="#FFF2B9" fill-opacity=".94"/>
        <path d="M0 292c78-68 158-83 240-20 82-94 196-97 360 10v118H0V292Z" fill="#8660DC" fill-opacity=".48"/>
        <path d="M0 340c101-61 190-55 268 12 88-76 199-70 332 8v40H0v-60Z" fill="#B96D9E" fill-opacity=".68"/>
        <circle cx="242" cy="185" r="43" fill="#FFFDF9" fill-opacity=".9"/>
        <path d="M157 352c14-97 51-145 85-145s71 48 85 145" fill="#251B2B"/>
        <circle cx="380" cy="201" r="38" fill="#FFFDF9" fill-opacity=".86"/>
        <path d="M306 352c12-86 44-129 74-129s62 43 74 129" fill="#4F3159"/>
      </g>
    </symbol>
  </defs>

  <rect width="960" height="720" fill="url(#chat-background)"/>
  <path d="M0 0h960v132H0z" fill="#251B2B"/>
  <path d="M0 132h960" stroke="#3B2E3F" stroke-width="2"/>

  <circle cx="62" cy="66" r="31" fill="#FF4F8B"/>
  <rect x="45" y="53" width="34" height="27" rx="7" fill="none" stroke="#FFFDF9" stroke-width="5"/>
  <circle cx="62" cy="66" r="7" fill="#FFD567"/>
  <path d="m52 53 5-7h11l5 7" fill="none" stroke="#FFFDF9" stroke-width="5" stroke-linecap="round"/>
  <text x="110" y="60" fill="#FFFDF9" font-family="Arial, sans-serif" font-size="25" font-weight="800">SO.GL · БОТ ПЕЧАТИ</text>
  <text x="110" y="92" fill="#ACE8D3" font-family="Arial, sans-serif" font-size="18" font-weight="700">бот мероприятия · онлайн</text>
  <rect x="820" y="44" width="102" height="44" rx="22" fill="#FFFDF9" fill-opacity=".12"/>
  <text x="871" y="72" text-anchor="middle" fill="#FFFDF9" font-family="Arial, sans-serif" font-size="18" font-weight="800">TG · VK</text>

  <g filter="url(#message-shadow)">
    <rect x="350" y="148" width="550" height="380" rx="30" fill="#FFFDF9"/>
    <path d="m900 484 20 35-44-8Z" fill="#FFFDF9"/>
    <use href="#guest-photo" x="370" y="168" width="510" height="340"/>
  </g>

  <g filter="url(#message-shadow)">
    <rect x="58" y="566" width="654" height="108" rx="30" fill="#ACE8D3"/>
    <path d="m58 632-18 28 39-8Z" fill="#ACE8D3"/>
    <circle cx="112" cy="620" r="27" fill="#251B2B"/>
    <path d="m99 620 9 9 19-23" fill="none" stroke="#FFFDF9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="158" y="613" fill="#251B2B" font-family="Arial, sans-serif" font-size="24" font-weight="850">Готово!</text>
    <text x="158" y="644" fill="#4D4450" font-family="Arial, sans-serif" font-size="20" font-weight="700">Фото отправлено на печать</text>
  </g>
</svg>
