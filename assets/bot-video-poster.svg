<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title description">
  <title id="title">Фотография отправлена боту печати</title>
  <desc id="description">Схематичная переписка: гость отправляет фотографию, а бот подтверждает, что она принята и отправлена на печать.</desc>
  <defs>
    <linearGradient id="background" x1="40" y1="20" x2="920" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5E8FF"/>
      <stop offset=".56" stop-color="#FFF8EF"/>
      <stop offset="1" stop-color="#FFE0EB"/>
    </linearGradient>
    <linearGradient id="photo" x1="382" y1="286" x2="858" y2="462" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF82A9"/>
      <stop offset=".5" stop-color="#FFD567"/>
      <stop offset="1" stop-color="#91C7FF"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="960" height="720" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#251B2B" flood-opacity=".13"/>
    </filter>
  </defs>

  <rect width="960" height="720" fill="url(#background)"/>
  <circle cx="84" cy="590" r="150" fill="#FFD567" fill-opacity=".32"/>
  <circle cx="890" cy="126" r="132" fill="#D9C3FF" fill-opacity=".45"/>

