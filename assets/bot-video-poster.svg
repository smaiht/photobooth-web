    <text x="835" y="91" text-anchor="middle" fill="#FFFDF9" font-family="Arial, sans-serif" font-size="18" font-weight="800">TG · VK</text>

    <rect x="76" y="170" width="610" height="88" rx="28" fill="#F1E6FA"/>
    <text x="106" y="207" fill="#251B2B" font-family="Arial, sans-serif" font-size="22" font-weight="700">Отправьте фотографию —</text>
    <text x="106" y="235" fill="#251B2B" font-family="Arial, sans-serif" font-size="22" font-weight="700">мы сразу передадим её в печать.</text>

    <rect x="354" y="282" width="528" height="226" rx="28" fill="#FFFDF9" stroke="#E3D7E5" stroke-width="2"/>
    <rect x="378" y="304" width="480" height="154" rx="18" fill="url(#photo)"/>
    <circle cx="790" cy="337" r="25" fill="#FFF2B9" fill-opacity=".9"/>
